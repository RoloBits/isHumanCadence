pre-commit:
  commands:
    branch:
      # main only moves through a pull request. CI is exempt: semantic-release
      # commits back to main from the release job, and blocking that would fail
      # a publish after the package is already on npm.
      run: |
        [ -n "$CI" ] && exit 0
        B=$(git rev-parse --abbrev-ref HEAD)
        [ "$B" != "main" ] || {
          echo "refusing: this is a commit on main."
          echo "main only moves through a pull request. Branch first:"
          echo "  git switch -c <type>/<slug>"
          exit 1
        }
        exit 0
    lint-staged:
      glob: "*.{ts,tsx}"
      run: npx lint-staged

commit-msg:
  commands:
    conventional:
      # The commit message is the release decision here: semantic-release reads
      # the type and publishes to npm off it. See .claude/skills/releasing/SKILL.md.
      run: |
        [ -n "$CI" ] && exit 0
        H=$(head -1 "{1}")
        case "$H" in
          fixup!*|squash!*|"Merge "*|"Revert "*) exit 0 ;;
        esac

        TYPES='feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert'
        echo "$H" | grep -qE "^($TYPES)(\([a-z0-9._/-]+\))?!?: .+" || {
          echo "refusing: commit subject is not a Conventional Commit."
          echo ""
          echo "  got: $H"
          echo "  want: <type>[(scope)][!]: <description>"
          echo "  type: feat fix perf docs style refactor test build ci chore revert"
          echo ""
          echo "The type is the release decision — semantic-release publishes off it."
          echo "feat -> minor, fix/perf -> patch, BREAKING CHANGE: footer -> major,"
          echo "anything else publishes nothing. See .claude/skills/releasing/SKILL.md"
          exit 1
        }

        case "$H" in
          feat*|fix*|perf*)
            git diff --cached --name-only | grep -q '^src/' || {
              echo "refusing: '${H%%[(:]*}' publishes a version, but nothing under src/ is staged."
              echo ""
              echo "  staged: $(git diff --cached --name-only | tr '\n' ' ')"
              echo ""
              echo "A release whose diff ships no library change reaches real installers"
              echo "with a changelog entry describing something else. Use chore/docs/test/ci,"
              echo "or stage the src/ change this message is really about."
              echo "See .claude/skills/releasing/SKILL.md"
              exit 1
            }
            ;;
        esac
        exit 0
