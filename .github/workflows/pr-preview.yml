name: PR Preview

# Ephemeral per-PR demo deploy. Builds the PR's demo and publishes it to
# gh-pages/pr-preview/pr-<N>/, comments the URL on the PR, and removes it when
# the PR closes. Used by core-logic PRs to show current vs proposed behavior.
#
# The Vite base is overridden to the preview subpath — without this every asset
# 404s, because the demo's own base is /isHumanCadence/ (the root site).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A second checkout of main's src only — this is the "current" engine the
      # comparison scores against. The branch's src is the "new" engine.
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          ref: main
          path: baseline-main
          sparse-checkout: src
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: examples/react/package-lock.json
      - name: Build the compare-only preview at the preview subpath
        if: github.event.action != 'closed'
        working-directory: examples/react
        # --mode preview loads .env.preview (VITE_APP_MODE=compare), so the
        # preview renders the comparison view only. VITE_BASELINE_SRC points the
        # baseline engine alias at main's src, so the comparison is main's
        # current engine vs this branch's engine on identical input.
        env:
          VITE_BASELINE_SRC: ${{ github.workspace }}/baseline-main/src
        run: |
          npm ci
          npm run build -- --mode preview --base=/isHumanCadence/pr-preview/pr-${{ github.event.number }}/
      - name: Deploy / tear down the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: examples/react/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
