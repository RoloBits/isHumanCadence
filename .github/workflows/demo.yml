name: Deploy Demo

# The main demo is served from the gh-pages branch root so that per-PR previews
# can live alongside it under gh-pages/pr-preview/pr-<N>/ (see pr-preview.yml).
# Pages source must be set to "Deploy from a branch: gh-pages /".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and deploy demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: examples/react/package-lock.json
      - run: npm ci
        working-directory: examples/react
      - run: npm run build
        working-directory: examples/react
      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: examples/react/dist
          destination_dir: .
          # keep_files preserves pr-preview/* so a main deploy does not wipe
          # active PR previews.
          keep_files: true
